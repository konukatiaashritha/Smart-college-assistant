<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Smart College Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="login-page">

  <main class="login-container" role="main">
    <div class="login-card">

      <div class="login-header">
        <span class="login-logo" aria-hidden="true">🎓</span>
        <h1 class="login-title">Smart College Assistant</h1>
        <p class="login-subtitle">Administrator Login</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-list" role="alert">
            {% for cat, msg in messages %}
              <div class="flash flash-{{ cat }}">{{ msg }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('admin_login') }}" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input id="username" class="form-control" type="text"
            name="username" autocomplete="username"
            required autofocus placeholder="Enter username" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="pw-wrap">
            <input id="password" class="form-control" type="password"
              name="password" autocomplete="current-password"
              required placeholder="Enter password" />
            <button type="button" class="pw-toggle" id="togglePw" aria-label="Toggle password visibility">👁</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Log In</button>
      </form>

      <p class="login-back">
        <a href="{{ url_for('index') }}">← Back to Chat</a>
      </p>
    </div>
  </main>

  <script>
    const pw  = document.getElementById('password');
    const btn = document.getElementById('togglePw');
    btn.addEventListener('click', () => {
      const showing = pw.type === 'text';
      pw.type = showing ? 'password' : 'text';
      btn.textContent = showing ? '👁' : '🙈';
    });
  </script>

</body>
</html>
